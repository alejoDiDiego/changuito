name: changuito-bootstrap
x-app: &app
  image: changuito-bootstrap-php:13.39.0
  build: { context: ., dockerfile: docker/php/Dockerfile }
  working_dir: /app
  volumes: ['.:/app', 'app-vendor:/app/vendor']
  environment: &env
    APP_ENV: local
    APP_KEY: ${APP_KEY:-}
    APP_DEBUG: 'false'
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: '5432'
    DB_DATABASE: changuito_dev
    DB_USERNAME: changuito_dev
    DB_PASSWORD: local-development-only
    SESSION_DRIVER: file
    CACHE_STORE: file
    QUEUE_CONNECTION: database
    MAIL_HOST: mailpit
    MAIL_PORT: '1025'
    INERTIA_SSR_URL: http://ssr:13714
x-node: &node
  image: changuito-bootstrap-node:24.15.0-npm12.0.2
  build: { context: ., dockerfile: docker/node/Dockerfile }
  working_dir: /app
  volumes: ['.:/app', 'node-deps:/app/node_modules']
services:
  app:
    <<: *app
    command: php-fpm
    depends_on: { postgres: { condition: service_healthy } }
  web:
    image: nginx:1.28.0-alpine
    ports: ['127.0.0.1:${WEB_PORT:-18080}:80']
    volumes: ['.:/app:ro', './docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [app]
    healthcheck: { test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/up'], interval: 5s, timeout: 10s, start_period: 10s, retries: 12 }
  postgres:
    image: postgres:18.6-alpine
    environment: { POSTGRES_DB: changuito_dev, POSTGRES_USER: changuito_dev, POSTGRES_PASSWORD: local-development-only }
    ports: ['127.0.0.1:55432:5432']
    volumes: ['dev-db:/var/lib/postgresql']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U changuito_dev -d changuito_dev'], interval: 2s, timeout: 3s, retries: 30 }
  postgres-test:
    image: postgres:18.6-alpine
    environment: { POSTGRES_DB: changuito_test, POSTGRES_USER: changuito_test, POSTGRES_PASSWORD: local-tests-only }
    ports: ['127.0.0.1:55433:5432']
    volumes: ['test-db:/var/lib/postgresql']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U changuito_test -d changuito_test'], interval: 2s, timeout: 3s, retries: 30 }
  node:
    <<: *node
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports: ['127.0.0.1:5173:5173']
    healthcheck: { test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5173/@vite/client').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"], interval: 3s, timeout: 5s, start_period: 5s, retries: 12 }
  ssr:
    <<: *node
    environment: { SSR_HOST: 0.0.0.0 }
    command: node bootstrap/ssr/ssr.js
    healthcheck: { test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:13714/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"], interval: 2s, timeout: 3s, retries: 30 }
  worker:
    <<: *app
    command: php artisan queue:work --sleep=3 --tries=1
    depends_on: { postgres: { condition: service_healthy } }
  mailpit:
    image: axllent/mailpit:v1.29.0
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
  quality:
    profiles: [quality]
    build: { context: ., dockerfile: docker/quality/Dockerfile }
    working_dir: /app
    volumes: ['.:/app', 'quality-node:/app/node_modules', 'quality-vendor:/app/vendor']
    environment:
      APP_ENV: testing
      DB_HOST: postgres-test
      DB_PORT: '5432'
      DB_DATABASE: changuito_test
      DB_USERNAME: changuito_test
      DB_PASSWORD: local-tests-only
    command: node scripts/verify-harness.mjs --application
    depends_on: { postgres-test: { condition: service_healthy } }
volumes:
  dev-db:
  test-db:
  node-deps:
  quality-node:
  quality-vendor:
  app-vendor:
